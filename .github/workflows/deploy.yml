name: Build, Test & Deploy AURA-CARE to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Strict TypeScript Check
        run: npm run typecheck

      - name: ESLint Zero-Warning Check
        run: npm run lint

      - name: Vitest Unit & Integration Coverage Gate
        run: npm run test:coverage

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Production App & Run E2E + WCAG Accessibility Suite
        run: |
          npm run build
          npx playwright test

      - name: Prepare static export for GitHub Pages (client-side CareVault fallback handles /api/* on github.io)
        run: |
          rm -rf src/app/api
          GITHUB_PAGES=true npm run build
          touch out/.nojekyll
          cp out/index.html out/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true

  deploy:
    needs: quality-and-build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
